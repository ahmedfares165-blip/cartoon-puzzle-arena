<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3b1d7a"><title>ساحة الألغاز</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<main><section id="lobby" class="card"><span class="logo">🧩</span><h1>ساحة الألغاز</h1><p>رتّب المربعات قبل الجميع. لا يوجد حدّ للوقت، لكن الأسرع يفوز!</p><label>اسمك<input id="name" maxlength="20" placeholder="مثال: نور"></label><button id="create">إنشاء غرفة جديدة</button><div class="join"><input id="code" maxlength="5" placeholder="رمز الغرفة"><button id="join">دخول الغرفة</button></div><small>كل غرفة تختار صورة كرتونية عشوائية موحّدة لكل اللاعبين.</small></section>
<section id="game" hidden><header><button id="leave" aria-label="مغادرة">×</button><div><b id="roomCode"></b><span id="timer">00:00</span></div><div id="players"></div></header><div class="reference"><div id="reference" role="img" aria-label="الصورة المطلوبة"></div><span>الصورة الأصلية</span></div><p id="message">اضغط مربعين لتبديل موضعيهما</p><div id="board" aria-label="لغز الصور"></div><p class="stats"><span id="moves">0 حركة</span><span>رتّب الصورة لتفوز</span></p></section>
</main><div id="toast" role="status"></div><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
